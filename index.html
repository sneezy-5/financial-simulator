<!doctype html>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"

  <!-- Tailwind CDN : utilisé uniquement par la landing Eonda RH (enterprise-site/src/App.vue,
       affichée quand currentModule === 'landing') fidèle au design Stitch. Le reset global
       de src/style.css (`* { margin:0; padding:0 }`) neutralise déjà l'essentiel des risques
       de collision avec le reste de l'app ; seul le fallback de bordure (border-style: solid
       posé par le preflight Tailwind) touche des éléments non stylés ailleurs — à vérifier
       visuellement si un écran affiche une bordure manquante après cette page. -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#004226",
            "primary-container": "#0F5B38",
            "primary-fixed": "#10B981",
            "primary-fixed-dim": "#8FD6A9",
            "brand-emerald-dark": "#0A3D25",
            "brand-emerald-light": "#DCFCE7",
            "brand-amber": "#F59E0B",
            "brand-amber-light": "#FEF3C7",
            "brand-orange": "#EA580C",
            "brand-orange-light": "#FFEDD5",
            "tertiary": "#00412F",
            "tertiary-container": "#005B43",
            "surface-mint": "#F0FDF4",
            "surface-cream": "#FDFBF7",
            "surface-canvas": "#F8FAFC",
            "surface-container-lowest": "#FFFFFF",
            "surface-container-low": "#F8FAFC",
            "surface-container": "#F1F5F9",
            "surface-container-high": "#E2E8F0",
            "surface-container-highest": "#CBD5E1",
            "footer-dark": "#07120E",
            "on-surface": "#0F172A",
            "on-surface-variant": "#475569",
            "outline": "#94A3B8",
            "outline-variant": "#CBD5E1"
          },
          fontFamily: {
            "headline-xl": ["'Plus Jakarta Sans'", "sans-serif"],
            "headline-lg": ["'Plus Jakarta Sans'", "sans-serif"],
            "headline-md": ["'Plus Jakarta Sans'", "sans-serif"],
            "headline-sm": ["'Plus Jakarta Sans'", "sans-serif"],
            "display-hero": ["'Plus Jakarta Sans'", "sans-serif"],

            "code-cell": ["'JetBrains Mono'", "monospace"]

          boxShadow: {

          }
        }
      }
    }

  <style>
    .hero-glow-mesh {
      background:
        radial-gradient(circle at 18% 15%, rgba(16, 185, 129, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 82% 18%, rgba(245, 158, 11, 0.24) 0%, transparent 42%),
        radial-gradient(circle at 50% 48%, rgba(15, 91, 56, 0.15) 0%, transparent 55%),
        radial-gradient(circle at 75% 75%, rgba(14, 165, 233, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 25% 85%, rgba(234, 88, 12, 0.14) 0%, transparent 45%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
  </style>
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var isHR = urlParams.get('module') === 'hr';
      var manifestUrl = isHR ? '/manifest-hr.json' : '/manifest.json';
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    })();
  </script>
  <!-- Dépendances pour docx-preview -->
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
