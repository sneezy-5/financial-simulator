# Bloc nginx pour le portfolio — site statique Astro.
# Adapte  server_name  et  root  (chemin réel du dépôt cloné sur le serveur),
# puis :  sudo certbot --nginx -d exemple.com -d www.exemple.com

# 1) www -> apex (ou l'inverse selon ta préférence)
server {
    listen 80;
    listen [::]:80;
    server_name www.exemple.com;
    return 301 https://exemple.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name exemple.com;

    root /var/www/onda-app/portfolio/dist;   # <-- chemin réel
    index index.html;

    # Astro est configuré en trailingSlash: 'always' + build.format: 'directory'
    location / {
        try_files $uri $uri/ /404.html;
    }

    # Assets hashés : cache long et immuable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fichiers utilitaires : cache court
    location = /sitemap-index.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; }

    # HTML : revalidation fréquente
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=600, must-revalidate";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 512;

    # brotli on;            # si le module est disponible
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
