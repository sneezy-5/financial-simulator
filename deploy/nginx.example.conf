# Exemple de bloc nginx (nginx installé nativement sur l'hôte, pas en
# conteneur) pointant vers onda-server, publié sur le port 3002 par Swarm
# (voir deploy/stack.yml — ports: "3002:3002").
#
# À copier dans /etc/nginx/sites-available/, ajuster server_name, puis :
#   ln -s /etc/nginx/sites-available/onda /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Pour le HTTPS, le plus simple reste certbot (`certbot --nginx -d
# votredomaine.com`), qui réécrit ce fichier lui-même pour ajouter le bloc 443
# — pas besoin de l'écrire à la main ici.

server {
    listen 80;
    server_name votredomaine.com;

    # Les imports Excel et modèles PDF dépassent facilement le défaut nginx
    # (1 Mo) — sans cette ligne, l'upload échoue avec une 413 avant même
    # d'atteindre l'app (multer, côté serveur, n'a lui-même aucune limite).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.IO, utilisé pour les mises à jour temps réel) —
        # sans ces deux lignes, la connexion WS échoue et l'app retombe en
        # polling HTTP (fonctionne, mais dégrade le temps réel silencieusement).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Utile si un appel IA (reconstruction de modèle, génération de
        # bulletins groupés) dépasse le timeout par défaut de nginx (60s).
        proxy_read_timeout 120s;
    }
}
