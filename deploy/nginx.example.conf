# Exemple de bloc nginx (nginx installé nativement sur l'hôte, pas en
# conteneur). Le frontend (dist/, construit par deploy/deploy.sh via
# `npm run build` sur l'hôte) est servi ici EN DIRECT par nginx — plus rapide
# qu'un aller-retour par Express — et seules les routes API/temps réel sont
# renvoyées vers le conteneur onda-server, publié sur le port 3002 par Swarm
# (voir deploy/stack.yml — ports: "3002:3002").
#
# À copier dans /etc/nginx/sites-available/, ajuster server_name et root
# (chemin du dépôt cloné sur ce serveur, ex: /var/www/rh-pro/dist), puis :
#   ln -s /etc/nginx/sites-available/onda /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Pour le HTTPS, le plus simple reste certbot (`certbot --nginx -d
# votredomaine.com`), qui réécrit ce fichier lui-même pour ajouter le bloc 443
# — pas besoin de l'écrire à la main ici.
#
# `map` doit vivre dans le contexte http {}, jamais dans server {} — sur la
# plupart des installs Debian/Ubuntu, /etc/nginx/nginx.conf inclut déjà
# conf.d/*.conf ou sites-enabled/*.conf AVANT le http {} qui nous intéresse ;
# le plus simple est de coller ce bloc directement dans nginx.conf, dans le
# http {} de premier niveau, une seule fois pour tout le serveur.
#
# Pourquoi : Socket.IO démarre TOUJOURS par une poignée de main HTTP classique
# (transport "polling") avant de tenter un upgrade WebSocket — sur ces
# requêtes-là, $http_upgrade est vide. Envoyer "Connection: upgrade" en dur
# même quand $http_upgrade est vide fait croire à Node qu'un changement de
# protocole est en cours ; la socket reste ouverte en attente d'un handshake
# qui ne vient jamais, jusqu'au proxy_read_timeout (504 Gateway Time-out).
# Ce map ne met "upgrade" que si $http_upgrade est réellement non-vide.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name votredomaine.com;

    # Les imports Excel et modèles PDF dépassent facilement le défaut nginx
    # (1 Mo) — sans cette ligne, l'upload échoue avec une 413 avant même
    # d'atteindre l'app (multer, côté serveur, n'a lui-même aucune limite).
    client_max_body_size 25m;

    # Chemin réel du dépôt sur ce serveur — ajustez-le. deploy/deploy.sh
    # reconstruit ce dossier à chaque déploiement ; nginx n'a rien à recharger
    # ensuite, il lit les fichiers du disque à chaque requête.
    root /var/www/rh-pro/dist;
    index index.html;

    # Frontend statique (SPA Vue) : sert le fichier demandé s'il existe,
    # sinon retombe sur index.html pour laisser le routeur côté client gérer
    # l'URL (sans ce fallback, un F5 sur une route interne renvoie une 404
    # nginx au lieu de recharger l'app).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Utile si un appel IA (reconstruction de modèle, génération de
        # bulletins groupés) dépasse le timeout par défaut de nginx (60s).
        proxy_read_timeout 120s;
    }

    # Socket.IO (mises à jour temps réel) — chemin par défaut de la lib,
    # jamais personnalisé côté serveur (voir server/server.js, `new Server(
    # server, ...)` sans option `path`). Upgrade/Connection utilisent le map
    # $connection_upgrade défini plus haut (jamais "upgrade" en dur — voir son
    # commentaire) : sans lui, le WebSocket échoue silencieusement (repli en
    # polling HTTP) ; en dur, ce sont les requêtes de polling elles-mêmes qui
    # se bloquent (504).
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
